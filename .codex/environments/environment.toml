version = 1
name = "dsh-gea-plugin"

[setup]
script = "node --version && corepack --version"

[[actions]]
name = "工具与输入检查"
icon = "tool"
command = "node scripts/development-tasks.mjs check"

[[actions]]
name = "准备依赖"
icon = "tool"
command = "node scripts/development-tasks.mjs prepare"

[[actions]]
name = "构建插件"
icon = "tool"
command = "node scripts/development-tasks.mjs build"

[[actions]]
name = "类型检查"
icon = "tool"
command = "node scripts/development-tasks.mjs typecheck"

[[actions]]
name = "收尾与占用报告"
icon = "tool"
command = "node scripts/development-tasks.mjs finish"

[[actions]]
name = "开发监听"
icon = "tool"
command = "corepack pnpm dev"

[[actions]]
name = "完整验收（冻结输入）"
icon = "tool"
command = 'node scripts/development-tasks.mjs verify --input "$DSH_QUALITY_INPUT" --sha256 "$DSH_QUALITY_INPUT_SHA256"'
