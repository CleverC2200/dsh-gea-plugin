  data_source: gea_agent
  public: true
  description: 销售预测明细；M预测仅使用is_split=1，M实际必须包含全部M行；同时查询两者时不得施加全局is_split=1。原表Z仅代表纠偏覆盖子集；纠偏后整月版本须使用独立effective模型。按计划月、授权范围、来源版本和单位解释。品类预算可能跨SKU重复，不能直接相加。本候选新指标尚待真实单位、回填与权限验收。
  meta:
    semantic_version: business-tables-20260923-1
    semantic_status: observed
    evidence:
    - docs/SOURCES.md#agents_sales_forecast_detail_mi
    business_grain_status: DDL主键不是业务粒度证明；详见来源卡
    candidate_status: not_deployed_pending_business_and_cube_acceptance
