      semantic_status: observed
      semantic_version: business-tables-20260923-1
      ai_context: 主键ID 数值维度显示单行原值，不自动求和；ID、价格、比率、天数不得作为可加数量。 月份×M/Z类型×客户×SKU预测；不合计月初与纠偏版本；未拆分可售SKU的0不等于预测缺失，实际销额可NULL；价格、份额、概率不求和。
