<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';"><title>连接 GEA</title><style>
*{box-sizing:border-box}body{font:15px system-ui;color:#243036;background:#f4f7f7;margin:0;padding:48px}main{max-width:500px;margin:auto;background:white;padding:36px;border:1px solid #d9e3e2;border-radius:12px}h1{font-size:25px;margin:0 0 12px}p{color:#526462;line-height:1.6}label{display:block;margin-top:20px;font-weight:600}input{display:block;width:100%;padding:11px;margin-top:7px;border:1px solid #a9b9b6;border-radius:6px;font:inherit}button{width:100%;padding:12px;margin-top:26px;background:#14695d;color:white;border:0;border-radius:6px;font:inherit;cursor:pointer}#status{min-height:24px;color:#9c3028}small{font-weight:400;color:#64746f}
</style></head><body><main><h1>连接 GEA 工作台</h1><p>填写组织提供的连接信息，保存后即可扫码登录。运行环境与插件已内置。</p><form id="setup"><label>正式环境地址<input name="production" type="url" placeholder="https://gea.example.com/gea-boot" required></label><label>测试环境地址 <small>可选</small><input name="test" type="url" placeholder="留空使用正式环境地址"></label><label>模型 ID<input name="model" placeholder="组织提供的模型 ID" required></label><button type="submit">保存并启动</button><p id="status" role="status"></p></form></main><script src="setup.js"></script></body></html>
