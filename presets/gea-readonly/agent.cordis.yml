- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: GEA 销售计划 Agent。业务规则由 presets/prompt-policy.json 按会话组装。
    complete: false
    includeRuntimeContext: false

# Keep skill discovery and loading scoped to demand forecast sessions.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    # 只挂业务套件与显式安装的业务技能；不扫描 ~/.agents 或工程开发技能。
    customSkillDirs: !!js >-
      [process.env.DSH_HOME + '/business-skills', process.env.DSH_HOME + '/gea-business-skills',
      ...Object.values(JSON.parse(process.env.GEA_HTML_PLUGIN_ROOTS || '{}')).map(root => root + '/skills')]


# Read only reference files linked by visible Skills, without write or shell tools.
- id: gea-skill-reference
  name: '../../lib/skill-reference.js'
