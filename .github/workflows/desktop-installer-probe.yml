name: Diagnose Windows staged plugin install
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: write
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'verify-installer-probe' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.1'
      - name: Download and install known candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloads = Join-Path $env:RUNNER_TEMP 'inputs'
          gh release download desktop-v0.0.5 --pattern '*win-x64.exe' --dir $downloads
          gh release download gea-v0.0.7 --pattern '*.tgz' --dir $downloads
          $installer = Get-ChildItem $downloads -Filter '*.exe' | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'gea-probe'
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-archive'
          7z x -y $installer.FullName "-o$archive" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed' }
          $payload = Get-ChildItem $archive -Recurse -Filter '*.7z' | Select-Object -First 1
          if (-not $payload) { Get-ChildItem $archive -Recurse | Select-Object FullName; throw 'Inner package not found' }
          7z x -y $payload.FullName "-o$destination" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Payload extraction failed' }
          "GEA_DESKTOP_PAYLOAD=$destination/resources/payload" >> $env:GITHUB_ENV
          $artifact = Get-ChildItem $downloads -Filter '*.tgz' | Select-Object -First 1
          "GEA_PLUGIN_ARTIFACT=$($artifact.FullName)" >> $env:GITHUB_ENV
      - name: Trace the official installer process lifecycle
        shell: pwsh
        run: |
          node desktop/installer-probe.mjs
