name: Frozen sales plugin artifacts
on:
  workflow_dispatch:
    inputs:
      workbench_sha:
        required: true
        type: string
      gea_sha:
        required: true
        type: string
      manage_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_ROOT: /tmp/sales-results-frozen-111-289
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: CleverC2200/dsh-agent-workbench
          ref: ${{ inputs.workbench_sha }}
          path: candidate/dsh-agent-workbench
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: CleverC2200/dsh-agent-manage
          ref: ${{ inputs.manage_sha }}
          path: candidate/dsh-agent-manage
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: CleverC2200/dsh-gea-plugin
          ref: ${{ inputs.gea_sha }}
          path: candidate/dsh-gea-plugin
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: CleverC2200/deepseek-harness
          ref: 0accab310546c1bc8d3ad46b8803dcbcfaa02477
          path: source/official-core
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
      - name: Prepare owned frozen source and declared managers
        run: |
          test ! -e "$RELEASE_ROOT"
          mkdir "$RELEASE_ROOT"
          mv candidate source "$RELEASE_ROOT/"
          npm install --global npm@11.11.0
          corepack enable
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc
          df -h "$RELEASE_ROOT"
      - name: Prepare fixed official Core
        run: node "$RELEASE_ROOT/candidate/dsh-agent-manage/scripts/prepare-official-sdk.mjs" --prepare --with-flock --core "$RELEASE_ROOT/official-latest-standard" --core-head 0accab310546c1bc8d3ad46b8803dcbcfaa02477 --source "$RELEASE_ROOT/source/official-core"
      - name: Build, deliver, preflight and receive frozen plugins
        run: node tools/scripts/remote-sales-release.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sales-frozen-artifacts-${{ github.run_id }}
          include-hidden-files: true
          path: /tmp/sales-results-frozen-111-289/release-output/
          if-no-files-found: error
