name: Isolated macOS one-click updater acceptance
on:
  workflow_dispatch:
    inputs:
      mac_complete_input:
        required: true
        type: string
      windows_overwrite_artifact_run:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native-macos-proof:
    runs-on: macos-15
    timeout-minutes: 28
    env:
      GEA_MAC_CASE: ${{ inputs.mac_complete_input }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.windows_overwrite_artifact_run }}
          name: Synear-GEA-mac-arm64-signed-${{ inputs.windows_overwrite_artifact_run }}
          path: ${{ runner.temp }}/signed-mac-candidate
      - name: Prepare updater acceptance dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund --workspaces=false --omit=dev --prefix "$RUNNER_TEMP/proof-deps" @playwright/test@1.58.2 yaml@2.9.0 semver@7.7.4
      - name: Exercise the signed macOS client from the installed baseline
        run: |
          ln -s "$RUNNER_TEMP/proof-deps/node_modules" node_modules
          node .verification/update-all/mac-native-proof.mjs "$RUNNER_TEMP/signed-mac-candidate"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-macos-update-all
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/gea-native-evidence/receipt.json
            ${{ runner.temp }}/gea-native-evidence/*-observation-*.json
            ${{ runner.temp }}/gea-native-evidence/before-*.json
            ${{ runner.temp }}/gea-native-evidence/clicked-*.json
            ${{ runner.temp }}/gea-native-evidence/before-*.png
            ${{ runner.temp }}/gea-native-evidence/data-*.json
