name: Delivery fixture checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-fixtures:
    if: github.ref_name != 'codex/windows-complete-local-20261016'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Only the declared semver runtime parser; no Core/SDK checkout, service or secrets.
      - run: |
          npm install --prefix .runtime/fixture-dependencies --ignore-scripts --no-package-lock --no-audit --no-fund semver@7.7.4
          ln -s "$PWD/.runtime/fixture-dependencies/node_modules" node_modules
      - run: node --run test:release-source
      - run: npm run test:delivery:packages
      - run: node --run test:delivery
      - run: node --run test:fixture-inputs
      - run: node --run test:prompt-execution
      - run: node --test tests/explicit-source-contract.test.mjs tests/source-composition.test.mjs

  windows-local-package:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/windows-complete-local-20261016'
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      DSH_DESKTOP_TARGET_PLATFORM: win32
      DSH_DESKTOP_TARGET_ARCH: x64
      DSH_DESKTOP_APP_ID: com.cleverc2200.gea.desktop
      DSH_DESKTOP_UNSIGNED: '1'
      DSH_DESKTOP_BUILD_COMMIT: 639ed015397290b3745d163aafe02ffee4aa3f84
      DSH_DESKTOP_BUILD_DIRTY: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_7Z_FILTER: BCJ
      LEFTHOOK: '0'
      GEA_COMPLETE_SOURCE_SHA: 317b886c7b2292586461c657f9841067cddaafbb
    steps:
      - uses: actions/checkout@v4
        with:
          path: packaging
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 317b886c7b2292586461c657f9841067cddaafbb
          path: gea
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 639ed015397290b3745d163aafe02ffee4aa3f84
          path: core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare fixed toolchain
        working-directory: core
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --prefer-offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows package and smoke runtime
        run: node packaging/scripts/windows-complete-local/build.mjs core gea
      - name: Keep package and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GEA-Desktop-rc2-win-x64-complete-local
          if-no-files-found: warn
          compression-level: 0
          path: |
            core/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
            core/apps/desktop/.desktop-build/targets/win-x64/gea-local/*.json
            core/apps/desktop/.desktop-build/targets/win-x64/gea-local/*.log
