name: Signed Windows update card verification
on:
  workflow_dispatch:
    inputs:
      mac_complete_input:
        required: true
        type: string
permissions:
  contents: read
jobs:
  signed-windows-card:
    runs-on: windows-2025
    timeout-minutes: 18
    env:
      GEA_CARD_CASE: ${{ inputs.mac_complete_input }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Prepare installed client UI acceptance
        shell: pwsh
        run: |
          $deps=Join-Path $env:RUNNER_TEMP 'card-tools'
          npm install --prefix $deps --no-audit --no-fund --ignore-scripts --no-package-lock @playwright/test@1.58.2 yaml@2.9.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Junction -Path node_modules -Target (Join-Path $deps 'node_modules') | Out-Null
      - name: Verify the update card in the released signed client
        shell: pwsh
        run: node .verification/update-card/check-installed-card.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-windows-card-proof
          if-no-files-found: warn
          path: ${{ runner.temp }}/gea-card-proof/evidence
