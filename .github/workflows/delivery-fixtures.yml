name: Windows Native diagnostics (unpublished)
on:
  workflow_dispatch:
    inputs:
      bundle_url:
        required: true
        type: string
      bundle_sha256:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native-only-diagnostic:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      TAR_OPTIONS: --force-local --quoting-style=literal
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - uses: actions/download-artifact@v4
        with:
          repository: CleverC2200/dsh-gea-plugin
          run-id: 40080180812
          artifact-ids: 12555370451
          github-token: ${{ github.token }}
          path: artifact
          merge-multiple: true
      - name: Select declared GNU tar for the existing archive contract
        shell: pwsh
        run: |
          $tarDirectory = Join-Path $env:ProgramFiles 'Git\usr\bin'
          $tarExecutable = Join-Path $tarDirectory 'tar.exe'
          if (!(Test-Path -LiteralPath $tarExecutable)) { throw 'DELIVERY_GNU_TAR_REQUIRED' }
          & $tarExecutable --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tarDirectory | Out-File -Append -FilePath $env:GITHUB_PATH
      - name: Prepare isolated diagnostic dependencies
        shell: pwsh
        run: npm install --prefix deps --ignore-scripts --no-package-lock --no-audit --no-fund @playwright/test@1.58.2 app-builder-lib@26.15.3 pnpm@11.7.0 yaml@2.9.0 7zip-bin@5.2.0
      - name: Read immutable diagnostic bundle and reuse exact installer
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { writeFileSync, mkdirSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { execFileSync } from 'node:child_process';
          const sha = process.env.BUNDLE_SHA256, url = new URL(process.env.BUNDLE_URL);
          assert(/^[a-f0-9]{64}$/.test(sha));
          assert.equal(url.href, 'https://synear-gea.oss-cn-hangzhou.aliyuncs.com/client-release/verification/' + sha + '/startup-restart-acceptance.tgz');
          const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(120000) });
          assert.equal(response.status, 200);
          const bytes = Buffer.from(await response.arrayBuffer());
          assert(bytes.length < 16 * 1024 * 1024);
          assert.equal(createHash('sha256').update(bytes).digest('hex'), sha);
          mkdirSync('bundle'); writeFileSync('bundle/input.tgz', bytes);
          const tar = args => execFileSync('tar', args, { cwd: resolve('bundle'), encoding: 'utf8' });
          const files = tar(['-tzf', 'input.tgz']).trim().split(/\r?\n/);
          assert(files.length < 1024 && files.includes('package/diagnostic-replay.mjs'));
          assert(files.every(file => file.startsWith('package/') && !/[\\:\r\t]/.test(file) && !file.split('/').some(part => part === '..' || part === '.')));
          assert(tar(['-tvzf', 'input.tgz']).trim().split(/\r?\n/).every(line => ['-', 'd'].includes(line[0])));
          tar(['-xzf', 'input.tgz']);
          execFileSync(process.execPath, ['bundle/package/diagnostic-replay.mjs', 'artifact', 'deps', 'diagnostic-evidence'], { stdio: 'inherit', timeout: 30 * 60000 });
          NODE
      - name: Keep diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-only-diagnostic-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            diagnostic-evidence/*.json
            diagnostic-evidence/native/**/*.json
            diagnostic-evidence/native/public/**/*.png
