name: Measure Windows EXE installation
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Unpublished diagnostic draft containing the fixed EXE inputs
        required: true
      test_mode:
        description: Installation case to measure
        type: choice
        options: [both, clean, upgrade]
        default: both
      enable_realtime:
        description: Enable and verify Defender real-time scanning on this disposable runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.test_mode == 'clean' && '["clean"]' || inputs.test_mode == 'upgrade' && '["upgrade"]' || '["clean","upgrade"]') }}
    # GitHub draft assets require write permission. Only the download step receives the token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download and verify fixed diagnostic inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TEST_MODE: ${{ matrix.mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $draft = gh release view $env:RELEASE_TAG --repo $env:REPOSITORY --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $draft.isDraft) { throw 'Expected an unpublished diagnostic draft' }
          $downloads = Join-Path $env:RUNNER_TEMP 'install-inputs'
          New-Item -ItemType Directory -Path $downloads | Out-Null
          $files = @(@{name='GEA-Desktop-0.0.13-preview.20260917-win-x64.exe'; sha='3fa823d92bc02716b36b3fab9e4afbce2ab2f40d84a45123153a2da0578d2769'})
          if ($env:TEST_MODE -eq 'upgrade') { $files += @{name='GEA-Desktop-0.0.12-win-x64.exe'; sha='5094db0f81f1532129266681ae07e64916fadce37aeea2314295dfa4651d0101'} }
          foreach ($file in $files) {
            gh release download $env:RELEASE_TAG --repo $env:REPOSITORY --pattern $file.name --dir $downloads
            if ($LASTEXITCODE -ne 0) { throw 'Draft asset download failed' }
            if ((Get-FileHash (Join-Path $downloads $file.name) -Algorithm SHA256).Hash.ToLower() -ne $file.sha) { throw 'Installer SHA mismatch' }
          }
      - name: Capture security state and optionally enable real-time scanning
        shell: pwsh
        env:
          ENABLE_REALTIME: ${{ inputs.enable_realtime }}
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'install-report'
          New-Item -ItemType Directory -Path $report | Out-Null
          if ($env:ENABLE_REALTIME -eq 'true') {
            try {
              Set-MpPreference -DisableRealtimeMonitoring $false
              Start-Sleep -Seconds 3
              if (-not (Get-MpComputerStatus).RealTimeProtectionEnabled) { throw 'Real-time protection could not be enabled on this image' }
            } catch {
              @{stage='security-setup'; error=$_.Exception.Message} | ConvertTo-Json | Set-Content (Join-Path $report 'security-error.json')
              throw
            }
          }
          $security = $null
          try { $security = Get-MpComputerStatus | Select-Object AMServiceEnabled,AntivirusEnabled,RealTimeProtectionEnabled,AntivirusSignatureVersion } catch {}
          @{os=(Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber); cpu=(Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores); disks=@(Get-CimInstance Win32_DiskDrive | Select-Object Model,MediaType,Size); security=$security; imageOS=$env:ImageOS; imageVersion=$env:ImageVersion} | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $report 'environment.json')
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'desktop/measure-windows-install.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Measure installation with five-second process and disk samples
        shell: pwsh
        env:
          TEST_MODE: ${{ matrix.mode }}
        run: |
          $downloads = Join-Path $env:RUNNER_TEMP 'install-inputs'
          $destination = Join-Path $env:RUNNER_TEMP 'gea-install-target'
          $report = Join-Path $env:RUNNER_TEMP 'install-report'
          if ($env:TEST_MODE -eq 'upgrade') {
            ./desktop/measure-windows-install.ps1 -Installer (Join-Path $downloads 'GEA-Desktop-0.0.12-win-x64.exe') -Destination $destination -ReportDirectory $report -Label baseline -TimeoutSeconds 1500
          }
          ./desktop/measure-windows-install.ps1 -Installer (Join-Path $downloads 'GEA-Desktop-0.0.13-preview.20260917-win-x64.exe') -Destination $destination -ReportDirectory $report -Label $env:TEST_MODE -TimeoutSeconds 1500
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-install-${{ matrix.mode }}
          path: ${{ runner.temp }}/install-report/
          retention-days: 7
