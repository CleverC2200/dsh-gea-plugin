name: Verify complete installer diagnostics
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Unpublished diagnostic draft
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        mode: [clean, upgrade]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download fixed inputs and reconstruct byte-identical diagnostic installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TEST_MODE: ${{ matrix.mode }}
        run: |
          $ErrorActionPreference='Stop'
          $draft=gh release view $env:RELEASE_TAG --repo $env:REPOSITORY --json isDraft | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or -not $draft.isDraft){throw 'Expected unpublished draft'}
          $files=@(
            @('GEA-Desktop-0.0.13-preview.20260917-win-x64-timing.exe','2e323dad4746e94c7b22328f47811b66fb4da4624243fab75505e05e4f4b8886'),
            @('full-diagnostic-v3-transfer.json.gz','bea0e7c1f064add5935eae71e356dfc1913abe575ef2798452648e3472ca1909'),
            @('installer-timing-probe-v3.exe','eca8708755d4c433c5a72aed7e5823bf9dc28c753dd5879dc111ba4aece5a921')
          )
          if($env:TEST_MODE -eq 'upgrade'){$files+=,@('GEA-Desktop-0.0.12-win-x64.exe','5094db0f81f1532129266681ae07e64916fadce37aeea2314295dfa4651d0101')}
          foreach($file in $files){
            gh release download $env:RELEASE_TAG --repo $env:REPOSITORY --pattern $file[0] --dir desktop
            if($LASTEXITCODE -ne 0){throw 'Download failed'}
            if((Get-FileHash (Join-Path 'desktop' $file[0])).Hash.ToLower() -ne $file[1]){throw 'Input hash mismatch'}
          }
          python desktop/apply-diagnostic-transfer.py desktop/GEA-Desktop-0.0.13-preview.20260917-win-x64-timing.exe desktop/full-diagnostic-v3-transfer.json.gz desktop/GEA-Desktop-0.0.13-preview.20260917-win-x64-full-diagnostic.exe
          if($LASTEXITCODE -ne 0){throw 'Reconstruction failed'}
      - name: Verify logging preserves NSIS error flags, registers, and stack
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:GEA_DIAG_DIR=Join-Path $env:RUNNER_TEMP 'probe-logs'
          $p=Start-Process desktop/installer-timing-probe-v3.exe -PassThru -Wait
          if($p.ExitCode -ne 0){throw 'NSIS state preservation failed'}
          $logs=Get-Content "$env:GEA_DIAG_DIR/stages-*.log" -Raw
          if($logs -notmatch 'errors=1 probe-error-set' -or $logs -notmatch 'errors=0 probe-error-clear' -or $logs -notmatch 'probe-pass'){throw 'Probe log content failed'}
          $env:GEA_DIAG_DIR=Join-Path $env:RUNNER_TEMP 'unwritable-probe-file'
          Set-Content -LiteralPath $env:GEA_DIAG_DIR -Value 'not a directory'
          $p=Start-Process desktop/installer-timing-probe-v3.exe -PassThru -Wait
          if($p.ExitCode -ne 0){throw 'A log write failure changed NSIS behavior'}
          Remove-Item Env:GEA_DIAG_DIR
      - name: Test collector using Windows PowerShell 5.1 and the real installer
        shell: powershell
        env:
          TEST_MODE: ${{ matrix.mode }}
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:RUNNER_TEMP 'gea-full-diagnostic-target'
          if($env:TEST_MODE -eq 'upgrade'){
            $old=Start-Process desktop/GEA-Desktop-0.0.12-win-x64.exe -ArgumentList '/S',"/D=$target" -PassThru -Wait
            if($old.ExitCode -ne 0){throw 'Baseline installation failed'}
          }
          ./desktop/collect-install-diagnostics.ps1 -Silent -Destination $target -MaxMinutes 15
          if(-not (Test-Path (Join-Path $target 'GEA Desktop.exe'))){throw 'Installed executable missing'}
          $report=Get-ChildItem desktop -Directory -Filter 'GEA-report-*' | Select-Object -First 1
          $result=Get-Content (Join-Path $report.FullName 'result.json') -Raw | ConvertFrom-Json
          if($result.sampleCount -lt 2 -or $result.stageFiles.Count -lt 1){throw 'Missing sampler evidence'}
          $log=(@(Get-ChildItem $report.FullName -Filter 'stages-*.log' | ForEach-Object {Get-Content $_.FullName}) -join "`n")
          if($env:TEST_MODE -eq 'upgrade' -and $log -notmatch 'old-uninstaller-temp-exec-end'){throw 'Upgrade did not exercise old uninstaller'}
          $installed=Get-ChildItem $target -Recurse -File | Measure-Object -Property Length -Sum
          @{mode=$env:TEST_MODE;count=$installed.Count;bytes=$installed.Sum;runnerImage=$env:ImageVersion} | ConvertTo-Json | Set-Content (Join-Path $report.FullName 'ci-installation.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: complete-diagnostics-${{ matrix.mode }}
          path: |
            desktop/GEA-report-*/
            desktop/GEA-report-*.zip
            ${{ runner.temp }}/probe-logs/
          retention-days: 14
