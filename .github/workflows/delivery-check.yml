name: Delivery checks

on:
  pull_request:
    paths:
      - ".github/workflows/delivery-check.yml"
      - "package.json"
      - "scripts/delivery-*.mjs"
      - "scripts/fixtures/delivery-history/**"
      - "scripts/source-combination-integrity.mjs"
      - "scripts/source-profile.mjs"
      - "scripts/source-composition.mjs"
      - "tests/explicit-source-contract.test.mjs"
      - "tests/source-composition.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/delivery-check.yml"
      - "package.json"
      - "scripts/delivery-*.mjs"
      - "scripts/fixtures/delivery-history/**"
      - "scripts/source-combination-integrity.mjs"
      - "scripts/source-profile.mjs"
      - "scripts/source-composition.mjs"
      - "tests/explicit-source-contract.test.mjs"
      - "tests/source-composition.test.mjs"

permissions:
  contents: read

jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
      # Built-in Node fixture checks only; no SDK, credentials or runtime setup.
      - name: Verify delivery reports and completion gates
        run: node --run test:delivery
      - name: Verify source combination reader contracts
        run: node --test tests/explicit-source-contract.test.mjs tests/source-composition.test.mjs
