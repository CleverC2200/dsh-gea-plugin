name: source-quality
run-name: "Repository source quality — ${{ github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      comparison_base:
        description: Full 40-character ancestor SHA for source acceptance comparison
        required: true
        type: string

env:
  SOURCE_BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.comparison_base || '' }}

permissions:
  contents: read

concurrency:
  group: source-quality-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && github.event.pull_request.base.ref == 'main' && (github.event.changes.title || github.event.changes.body) && !github.event.changes.base && !github.event.changes.head && github.run_id || 'source' }}
  cancel-in-progress: true

jobs:
  source-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: candidate/dsh-gea-plugin
    outputs:
      validate: ${{ steps.event.outputs.validate }}
      workbench-sha: ${{ steps.plan.outputs.workbench-sha }}
      manage-sha: ${{ steps.plan.outputs.manage-sha }}
      gea-sha: ${{ steps.plan.outputs.gea-sha }}
      core-sha: ${{ steps.source-matrix.outputs.core-sha }}
      mode: ${{ steps.plan.outputs.mode }}
      engineering: ${{ steps.plan.outputs.engineering }}
      workflows: ${{ steps.plan.outputs.workflows }}
      dependency-review: ${{ steps.plan.outputs.dependency-review }}
      codeql: ${{ steps.plan.outputs.codeql }}
      parallel: ${{ steps.source-matrix.outputs.parallel }}
      shards: ${{ steps.source-matrix.outputs.shards || '["single"]' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate/dsh-gea-plugin
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
      - name: Admit source input changes
        id: event
        run: node scripts/source-quality.mjs --phase event
      - name: Check fast CI contracts
        shell: bash
        run: |
          mkdir -p .runtime/workflow-preflight
          node --test --test-concurrency=3 scripts/workflow-preflight.test.mjs scripts/source-formal-receipt.test.mjs 2>&1 | tee .runtime/workflow-preflight/contracts.log
          node --test --test-name-pattern='^(a README-only|title and body edits|source workflow keeps|candidate-quality accepts)' scripts/source-quality.test.mjs 2>&1 | tee .runtime/workflow-preflight/admission.log
      - name: Classify actual Git changes
        id: plan
        if: steps.event.outputs.validate == 'true'
        shell: bash
        run: node scripts/source-quality.mjs --phase plan | tee source-plan.json
      - name: Check changed workflow semantics
        if: steps.plan.outputs.workflows == 'true'
        shell: bash
        env:
          WORKFLOW_FILES: ${{ steps.plan.outputs.workflow-files }}
          ACTIONLINT: ${{ runner.temp }}/workflow-preflight/actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/workflow-preflight"
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/workflow-preflight/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/workflow-preflight/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/workflow-preflight/actionlint.tar.gz" -C "$RUNNER_TEMP/workflow-preflight" actionlint
          node --input-type=module -e "import { checkWorkflows } from './scripts/workflow-preflight.mjs'; console.log(JSON.stringify(checkWorkflows(JSON.parse(process.env.WORKFLOW_FILES))))" 2>&1 | tee .runtime/workflow-preflight/semantics.log
      - name: Keep workflow preflight evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-preflight-${{ github.run_attempt }}
          include-hidden-files: true
          path: candidate/dsh-gea-plugin/.runtime/workflow-preflight
          if-no-files-found: ignore
      - uses: actions/checkout@v7
        if: steps.plan.outputs.engineering == 'true'
        with:
          repository: CleverC2200/dsh-agent-workbench
          ref: ${{ steps.plan.outputs.workbench-sha }}
          path: source/dsh-agent-workbench
          fetch-depth: 0
          token: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v7
        if: steps.plan.outputs.engineering == 'true'
        with:
          repository: CleverC2200/dsh-agent-manage
          ref: ${{ steps.plan.outputs.manage-sha }}
          path: candidate/dsh-agent-manage
          fetch-depth: 0
          token: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
          persist-credentials: false
      - name: Plan independent source-check workers
        if: steps.plan.outputs.engineering == 'true'
        id: source-matrix
        run: |
          node scripts/source-quality.mjs --phase affected-plan
          node scripts/source-check-shards.mjs --matrix .runtime/source-checks-plan.json
      - name: Record formal source inputs
        if: github.event_name == 'pull_request' && steps.event.outputs.validate == 'true'
        env:
          SOURCE_EVENT_VALIDATE: ${{ steps.event.outputs.validate }}
          SOURCE_MATRIX_PARALLEL: ${{ steps.source-matrix.outputs.parallel || 'false' }}
          SOURCE_MATRIX_SHARDS: ${{ steps.source-matrix.outputs.shards || '["single"]' }}
        run: node scripts/source-formal-receipt.mjs --phase record --plan source-plan.json --output source-input.json
      - name: Keep formal source input receipt
        if: github.event_name == 'pull_request' && steps.event.outputs.validate == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: source-inputs-${{ github.run_attempt }}
          path: candidate/dsh-gea-plugin/source-input.json
          if-no-files-found: error
      - name: Keep preparation-free selection and cost
        if: always() && steps.plan.outputs.engineering == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: source-cost-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            candidate/dsh-gea-plugin/.runtime/source-checks-plan.json
            candidate/dsh-gea-plugin/.runtime/source-check-cost.json
          if-no-files-found: ignore

  dependency-policy:
    needs: source-plan
    if: needs.source-plan.outputs.validate == 'true' && needs.source-plan.outputs.engineering == 'true' && needs.source-plan.outputs.parallel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: preparation/dsh-gea-plugin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source-plan.outputs.gea-sha }}
          path: preparation/dsh-gea-plugin
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
      - uses: actions/checkout@v7
        with:
          repository: CleverC2200/deepseek-harness
          ref: ${{ needs.source-plan.outputs.core-sha }}
          path: preparation/official-core
          fetch-depth: 1
          persist-credentials: false
      - name: Verify fresh dependency policies once for this run
        run: |
          corepack enable
          node scripts/dependency-policy.mjs --prepare --gea "$PWD" --core "$GITHUB_WORKSPACE/preparation/official-core" --directory "$RUNNER_TEMP/dependency-policy"
      - uses: actions/upload-artifact@v7
        with:
          name: dependency-policy-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dependency-policy/receipt.json
            ${{ runner.temp }}/dependency-policy/policy-cache.jsonl
          if-no-files-found: error

  source-checks:
    name: ${{ matrix.shard == 'single' && 'source-checks' || format('source-checks ({0})', matrix.shard) }}
    needs: [source-plan, dependency-policy]
    if: always() && needs.source-plan.result == 'success' && needs.source-plan.outputs.validate == 'true' && needs.source-plan.outputs.mode != 'docs' && (needs.dependency-policy.result == 'success' || needs.dependency-policy.result == 'skipped')
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        shard: ${{ fromJSON(needs.source-plan.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QUALITY_GROUP_GEA: ${{ needs.source-plan.outputs.gea-sha }}
      QUALITY_GROUP_MANAGE: ${{ needs.source-plan.outputs.manage-sha }}
      QUALITY_GROUP_WORKBENCH: ${{ needs.source-plan.outputs.workbench-sha }}
      GEA_SOURCE_CHECK_SHARD: ${{ matrix.shard != 'single' && matrix.shard || '' }}
      GEA_SOURCE_CHECK_SHARD_COUNT: ${{ strategy.job-total }}
      GEA_TEST_LIFECYCLE_RECEIPT: ${{ github.workspace }}/profile-lifecycle.ndjson
      PNPM_CONFIG_CACHE_DIR: ${{ github.workspace }}/.pnpm-policy-cache
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: candidate/dsh-gea-plugin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate/dsh-gea-plugin
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 24.22.0
      - uses: actions/checkout@v7
        if: needs.source-plan.outputs.engineering == 'true'
        with:
          repository: CleverC2200/dsh-agent-workbench
          ref: ${{ needs.source-plan.outputs.workbench-sha }}
          path: source/dsh-agent-workbench
          fetch-depth: 0
          token: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v7
        if: needs.source-plan.outputs.engineering == 'true'
        with:
          repository: CleverC2200/dsh-agent-manage
          ref: ${{ needs.source-plan.outputs.manage-sha }}
          path: candidate/dsh-agent-manage
          fetch-depth: 0
          token: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
          persist-credentials: false
      - name: Select affected behavior and type checks before preparation
        if: needs.source-plan.outputs.engineering == 'true'
        id: affected
        run: |
          node scripts/source-quality.mjs --phase affected-plan
          if [ -n "$GEA_SOURCE_CHECK_SHARD" ]; then
            node scripts/source-check-shards.mjs --scope .runtime/source-checks-plan.json --output ../../source-checks-scope.json
          fi
      - name: Reuse matching merged PR tool checks
        if: needs.source-plan.outputs.engineering == 'true'
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../../source/dsh-agent-workbench/scripts/source-result.mjs --phase lookup
      - name: Check applicable repository source
        if: steps.reuse.outputs.hit != 'true'
        run: node scripts/source-quality.mjs --phase check
      - name: Check committed package version
        if: needs.source-plan.outputs.engineering == 'true' && steps.reuse.outputs.hit != 'true'
        run: node scripts/generate-plugin-package-version.mjs --check
      - name: Select registered Core for fixed dependency links and SDK consumers
        if: steps.affected.outputs.core == 'true' && steps.reuse.outputs.hit != 'true'
        id: core
        run: node --input-type=module -e "import { appendFileSync } from 'node:fs'; import { ciCores } from '../dsh-gea-plugin/scripts/ci-core-policy.mjs'; appendFileSync(process.env.GITHUB_OUTPUT, 'head=' + ciCores('required')[0].head + '\n')"
      - uses: actions/checkout@v7
        if: steps.affected.outputs.core == 'true' && steps.reuse.outputs.hit != 'true'
        with:
          repository: CleverC2200/deepseek-harness
          ref: ${{ steps.core.outputs.head }}
          path: source/official-core
          fetch-depth: 1
          persist-credentials: false
      - name: Verify selected Core source before dependency preparation
        if: steps.affected.outputs.core == 'true' && steps.reuse.outputs.hit != 'true'
        env:
          QUALITY_CORE_HEAD: ${{ steps.core.outputs.head }}
        run: |
          node --input-type=module -e "import { verifyOfficialSource } from '../dsh-agent-manage/scripts/prepare-official-sdk.mjs'; console.log(JSON.stringify(verifyOfficialSource(process.env.GITHUB_WORKSPACE + '/source/official-core', { coreHead: process.env.QUALITY_CORE_HEAD })))"
      - name: Download this run's native policy cache
        if: needs.dependency-policy.result == 'success' && steps.affected.outputs.core == 'true' && steps.reuse.outputs.hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: dependency-policy-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-policy-input
      - name: Restore policies into this worker's private cache
        if: needs.dependency-policy.result == 'success' && steps.affected.outputs.core == 'true' && steps.reuse.outputs.hit != 'true'
        run: node scripts/dependency-policy.mjs --restore --gea "$PWD" --core "$GITHUB_WORKSPACE/source/official-core" --directory "$RUNNER_TEMP/dependency-policy-input" --cache "$PNPM_CONFIG_CACHE_DIR" > ../../dependency-policy-receipt.json
      - name: Read fixed Core command metadata for knowledge checks
        if: steps.affected.outputs.tooling == 'true' && steps.reuse.outputs.hit != 'true'
        run: |
          node --input-type=module <<'NODE'
          import { ciCores } from './scripts/ci-core-policy.mjs';
          import { prepareCoreCommandMetadata } from '../../source/dsh-agent-workbench/scripts/source-tools.mjs';
          console.log(JSON.stringify({ coreMetadata: await prepareCoreCommandMetadata(ciCores('required')[0].head, process.env.GITHUB_WORKSPACE) }));
          NODE
      - name: Enable declared package managers
        if: (steps.affected.outputs.dependencies == 'true' || steps.affected.outputs.sdk == 'true') && steps.reuse.outputs.hit != 'true'
        run: |
          if [ "${{ steps.affected.outputs.tooling }}" != 'true' ]; then
            npm install --global npm@11.11.0
          fi
          corepack enable
      - name: Locate existing package download cache
        if: steps.affected.outputs.core == 'true' && steps.reuse.outputs.hit != 'true'
        id: cache-path
        working-directory: candidate/dsh-agent-manage
        run: echo "store=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: download-cache
        if: steps.affected.outputs.core == 'true' && steps.reuse.outputs.hit != 'true'
        with:
          path: |
            ~/.npm
            ~/.cache/node/corepack
            ${{ steps.cache-path.outputs.store }}
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml') }}
          restore-keys: downloads-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache/restore@v4
        if: steps.affected.outputs.tooling == 'true' && steps.reuse.outputs.hit != 'true'
        id: tool-download-cache
        with:
          path: ${{ steps.affected.outputs.tools-downloads }}
          key: source-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ steps.affected.outputs.tools-key }}
      - name: Prepare owned Core source without compiling
        if: steps.affected.outputs.core == 'true' && steps.reuse.outputs.hit != 'true'
        run: node "$GITHUB_WORKSPACE/candidate/dsh-agent-manage/scripts/prepare-official-sdk.mjs" --prepare-source --core "$GITHUB_WORKSPACE/official-latest-standard" --core-head "${{ steps.core.outputs.head }}" --source "$GITHUB_WORKSPACE/source/official-core"
      - name: Locate SDK artifact cache paths
        if: steps.affected.outputs.sdk == 'true' && steps.reuse.outputs.hit != 'true'
        id: sdk-paths
        run: node "$GITHUB_WORKSPACE/candidate/dsh-agent-manage/scripts/sdk-artifact-cache.mjs" --github-paths "$GITHUB_WORKSPACE/official-latest-standard"
      - uses: actions/cache/restore@v4
        if: steps.affected.outputs.sdk == 'true' && steps.reuse.outputs.hit != 'true'
        id: sdk-cache
        with:
          path: ${{ steps.sdk-paths.outputs.paths }}
          key: sdk-${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ steps.core.outputs.head }}-${{ hashFiles('candidate/dsh-agent-manage/scripts/prepare-official-sdk.mjs', 'candidate/dsh-agent-manage/scripts/sdk-artifact-cache.mjs', 'candidate/dsh-gea-plugin/scripts/supported-cores.json', 'source/official-core/pnpm-lock.yaml') }}
      - name: Prepare or verify SDK through existing cache contract
        if: steps.affected.outputs.sdk == 'true' && steps.reuse.outputs.hit != 'true'
        run: node "$GITHUB_WORKSPACE/candidate/dsh-agent-manage/scripts/prepare-official-sdk.mjs" --prepare --reuse-prepared --with-flock --core "$GITHUB_WORKSPACE/official-latest-standard" --core-head "${{ steps.core.outputs.head }}" --source "$GITHUB_WORKSPACE/source/official-core"
      - uses: actions/cache/save@v4
        if: success() && steps.affected.outputs.sdk == 'true' && steps.sdk-cache.outputs.cache-hit != 'true' && steps.reuse.outputs.hit != 'true'
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ${{ steps.sdk-paths.outputs.paths }}
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Prepare dependencies consumed by selected checks
        if: steps.affected.outputs.dependencies == 'true' && steps.reuse.outputs.hit != 'true'
        run: node scripts/source-quality.mjs --phase affected-prepare
      - uses: actions/cache/save@v4
        if: success() && steps.affected.outputs.tooling == 'true' && steps.tool-download-cache.outputs.cache-hit != 'true' && steps.reuse.outputs.hit != 'true'
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ${{ steps.affected.outputs.tools-downloads }}
          key: ${{ steps.tool-download-cache.outputs.cache-primary-key }}
      - name: Run affected behavior and real TypeScript checks
        if: needs.source-plan.outputs.engineering == 'true' && steps.reuse.outputs.hit != 'true'
        run: node scripts/source-quality.mjs --phase affected-check
      - uses: actions/cache/save@v4
        if: success() && steps.affected.outputs.core == 'true' && steps.download-cache.outputs.cache-hit != 'true' && steps.reuse.outputs.hit != 'true'
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: |
            ~/.npm
            ~/.cache/node/corepack
            ${{ steps.cache-path.outputs.store }}
          key: ${{ steps.download-cache.outputs.cache-primary-key }}
      - name: Publish reusable tool-check receipt
        if: success() && (matrix.shard == '1' || matrix.shard == 'single') && needs.source-plan.outputs.engineering == 'true' && steps.reuse.outputs.hit != 'true'
        id: receipt
        run: node ../../source/dsh-agent-workbench/scripts/source-result.mjs --phase record
      - name: Store reusable tool-check receipt
        if: steps.receipt.outputs.published == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: source-result-${{ github.run_attempt }}
          include-hidden-files: true
          path: candidate/dsh-gea-plugin/.runtime/source-result.json
          if-no-files-found: error
      - name: Keep source selection and executed check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-checks-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            candidate/dsh-gea-plugin/.runtime/source-checks-plan.json
            candidate/dsh-gea-plugin/.runtime/source-tools.json
            candidate/dsh-gea-plugin/.runtime/source-result-reuse.json
            candidate/dsh-gea-plugin/.runtime/quality-fast.json
            candidate/dsh-gea-plugin/.runtime/detail-summary/
            candidate/dsh-gea-plugin/quality-checks.json
            quality-test-plan.json
            quality-test-execution-plan.json
            quality-stages.json
            quality-checks.json
            source-checks-scope.json
            quality-stages.json
            quality-test-execution.json
            quality-test-results/
            profile-lifecycle.ndjson
            dependency-policy-receipt.json
          if-no-files-found: ignore

  dependency-review:
    needs: source-plan
    if: needs.source-plan.outputs.dependency-review == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  candidate-quality:
    name: candidate-quality
    permissions:
      contents: read
      actions: read
    if: always()
    needs: [source-plan, source-checks, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.source-plan.result == 'success' && needs.source-plan.outputs.validate == 'false' && 75 || 5 }}
    steps:
      - name: Check out source inputs
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare source receipt verification
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
      - name: Find latest complete formal source
        id: formal
        if: needs.source-plan.result == 'success' && needs.source-plan.outputs.validate == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/source-formal-receipt.mjs --phase lookup --output source-formal-selection.json
      - name: Download exact formal source input receipt
        if: needs.source-plan.result == 'success' && needs.source-plan.outputs.validate == 'false'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.formal.outputs.artifact-id }}
          run-id: ${{ steps.formal.outputs.run-id }}
          github-token: ${{ github.token }}
          path: source-formal-input
      - name: Verify latest formal source receipt
        if: needs.source-plan.result == 'success' && needs.source-plan.outputs.validate == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/source-formal-receipt.mjs --phase verify --selection source-formal-selection.json --receipt source-formal-input/source-input.json
      - name: Download source-check shard receipts
        if: (needs.source-plan.result != 'success' || needs.source-plan.outputs.validate != 'false') && needs.source-plan.outputs.parallel == 'true' && needs.source-checks.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: source-checks-*
          path: source-check-shards
      - name: Require complete source-check execution
        if: (needs.source-plan.result != 'success' || needs.source-plan.outputs.validate != 'false') && needs.source-plan.outputs.parallel == 'true' && needs.source-checks.result == 'success'
        run: node scripts/source-check-shards.mjs --aggregate source-check-shards
      - name: Require successful applicable checks
        id: admission
        if: (needs.source-plan.result != 'success' || needs.source-plan.outputs.validate != 'false')
        env:
          PLAN_RESULT: ${{ needs.source-plan.result }}
          CHECK_RESULT: ${{ needs.source-checks.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
        run: node scripts/source-quality.mjs --phase final
      - name: Report functional and performance results separately
        if: always() && (needs.source-plan.result != 'success' || needs.source-plan.outputs.validate != 'false')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_ADMISSION_RESULT: ${{ steps.admission.outcome }}
        run: node scripts/quality-hosted-budget.mjs --source-report source-budget.json --mode in-gate
      - name: Keep source workflow performance
        if: always() && (needs.source-plan.result != 'success' || needs.source-plan.outputs.validate != 'false')
        uses: actions/upload-artifact@v7
        with:
          name: source-budget-${{ github.run_attempt }}
          path: source-budget.json
          if-no-files-found: error
