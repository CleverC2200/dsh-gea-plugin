name: source-quality
run-name: "Repository source quality — ${{ github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: source-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workbench-sha: ${{ steps.plan.outputs.workbench-sha }}
      manage-sha: ${{ steps.plan.outputs.manage-sha }}
      gea-sha: ${{ steps.plan.outputs.gea-sha }}
      mode: ${{ steps.plan.outputs.mode }}
      engineering: ${{ steps.plan.outputs.engineering }}
      workflows: ${{ steps.plan.outputs.workflows }}
      dependency-review: ${{ steps.plan.outputs.dependency-review }}
      codeql: ${{ steps.plan.outputs.codeql }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Classify actual Git changes
        id: plan
        run: node scripts/source-quality.mjs --phase plan
      - name: Check changed workflow semantics
        if: steps.plan.outputs.workflows == 'true'
        shell: bash
        env:
          WORKFLOW_FILES: ${{ steps.plan.outputs.workflow-files }}
          ACTIONLINT: ${{ runner.temp }}/workflow-preflight/actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/workflow-preflight"
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/workflow-preflight/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/workflow-preflight/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/workflow-preflight/actionlint.tar.gz" -C "$RUNNER_TEMP/workflow-preflight" actionlint
          node --input-type=module -e "import { checkWorkflows } from './scripts/workflow-preflight.mjs'; console.log(JSON.stringify(checkWorkflows(JSON.parse(process.env.WORKFLOW_FILES))))"

  source-checks:
    needs: source-plan
    if: needs.source-plan.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: candidate/dsh-gea-plugin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate/dsh-gea-plugin
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 24
      - name: Check applicable repository source
        run: node scripts/source-quality.mjs --phase check
      - name: Check committed package version
        if: needs.source-plan.outputs.engineering == 'true'
        run: node scripts/generate-plugin-package-version.mjs --check
      - uses: actions/checkout@v7
        if: needs.source-plan.outputs.engineering == 'true'
        with:
          repository: CleverC2200/dsh-agent-workbench
          ref: ${{ needs.source-plan.outputs.workbench-sha }}
          path: source/dsh-agent-workbench
          fetch-depth: 0
          token: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v7
        if: needs.source-plan.outputs.engineering == 'true'
        with:
          repository: CleverC2200/dsh-agent-manage
          ref: ${{ needs.source-plan.outputs.manage-sha }}
          path: candidate/dsh-agent-manage
          fetch-depth: 0
          token: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
          persist-credentials: false
      - name: Select affected behavior and type checks before preparation
        if: needs.source-plan.outputs.engineering == 'true'
        id: affected
        run: node scripts/source-quality.mjs --phase affected-plan
      - name: Select registered Core for fixed dependency links and SDK consumers
        if: steps.affected.outputs.core == 'true'
        id: core
        run: node --input-type=module -e "import { appendFileSync } from 'node:fs'; import { ciCores } from '../dsh-gea-plugin/scripts/ci-core-policy.mjs'; appendFileSync(process.env.GITHUB_OUTPUT, 'head=' + ciCores('required')[0].head + '\n')"
      - uses: actions/checkout@v7
        if: steps.affected.outputs.core == 'true'
        with:
          repository: CleverC2200/deepseek-harness
          ref: ${{ steps.core.outputs.head }}
          path: source/official-core
          fetch-depth: 0
          persist-credentials: false
      - name: Verify selected Core source before dependency preparation
        if: steps.affected.outputs.core == 'true'
        env:
          QUALITY_CORE_HEAD: ${{ steps.core.outputs.head }}
        run: |
          node --input-type=module -e "import { verifyOfficialSource } from '../dsh-agent-manage/scripts/prepare-official-sdk.mjs'; console.log(JSON.stringify(verifyOfficialSource(process.env.GITHUB_WORKSPACE + '/source/official-core', { coreHead: process.env.QUALITY_CORE_HEAD })))"
      - name: Enable declared package managers
        if: steps.affected.outputs.dependencies == 'true' || steps.affected.outputs.sdk == 'true'
        run: |
          if [ "${{ steps.affected.outputs.tooling }}" != 'true' ]; then
            npm install --global npm@11.11.0
          fi
          corepack enable
      - name: Locate existing package download cache
        if: steps.affected.outputs.core == 'true'
        id: cache-path
        working-directory: candidate/dsh-agent-manage
        run: echo "store=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: download-cache
        if: steps.affected.outputs.core == 'true'
        with:
          path: |
            ~/.npm
            ~/.cache/node/corepack
            ${{ steps.cache-path.outputs.store }}
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml') }}
          restore-keys: downloads-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache/restore@v4
        if: steps.affected.outputs.tooling == 'true'
        id: tool-download-cache
        with:
          path: ${{ steps.affected.outputs.tools-downloads }}
          key: source-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ steps.affected.outputs.tools-key }}
      - name: Prepare owned Core source without compiling
        if: steps.affected.outputs.core == 'true'
        run: node "$GITHUB_WORKSPACE/candidate/dsh-agent-manage/scripts/prepare-official-sdk.mjs" --prepare-source --core "$GITHUB_WORKSPACE/official-latest-standard" --core-head "${{ steps.core.outputs.head }}" --source "$GITHUB_WORKSPACE/source/official-core"
      - name: Locate SDK artifact cache paths
        if: steps.affected.outputs.sdk == 'true'
        id: sdk-paths
        run: node "$GITHUB_WORKSPACE/candidate/dsh-agent-manage/scripts/sdk-artifact-cache.mjs" --github-paths "$GITHUB_WORKSPACE/official-latest-standard"
      - uses: actions/cache/restore@v4
        if: steps.affected.outputs.sdk == 'true'
        id: sdk-cache
        with:
          path: ${{ steps.sdk-paths.outputs.paths }}
          key: sdk-${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ steps.core.outputs.head }}-${{ hashFiles('candidate/dsh-agent-manage/scripts/prepare-official-sdk.mjs', 'candidate/dsh-agent-manage/scripts/sdk-artifact-cache.mjs', 'candidate/dsh-gea-plugin/scripts/supported-cores.json', 'source/official-core/pnpm-lock.yaml') }}
      - name: Prepare or verify SDK through existing cache contract
        if: steps.affected.outputs.sdk == 'true'
        run: node "$GITHUB_WORKSPACE/candidate/dsh-agent-manage/scripts/prepare-official-sdk.mjs" --prepare --reuse-prepared --with-flock --core "$GITHUB_WORKSPACE/official-latest-standard" --core-head "${{ steps.core.outputs.head }}" --source "$GITHUB_WORKSPACE/source/official-core"
      - uses: actions/cache/save@v4
        if: success() && steps.affected.outputs.sdk == 'true' && steps.sdk-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ${{ steps.sdk-paths.outputs.paths }}
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Prepare dependencies consumed by selected checks
        if: steps.affected.outputs.dependencies == 'true'
        run: node scripts/source-quality.mjs --phase affected-prepare
      - uses: actions/cache/save@v4
        if: success() && steps.affected.outputs.tooling == 'true' && steps.tool-download-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ${{ steps.affected.outputs.tools-downloads }}
          key: ${{ steps.tool-download-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: success() && steps.affected.outputs.core == 'true' && steps.download-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: |
            ~/.npm
            ~/.cache/node/corepack
            ${{ steps.cache-path.outputs.store }}
          key: ${{ steps.download-cache.outputs.cache-primary-key }}
      - name: Run affected behavior and real TypeScript checks
        if: needs.source-plan.outputs.engineering == 'true'
        run: node scripts/source-quality.mjs --phase affected-check
      - name: Keep source selection and executed check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-checks
          path: |
            candidate/dsh-gea-plugin/.runtime/source-checks-plan.json
            candidate/dsh-gea-plugin/.runtime/source-tools.json
            candidate/dsh-gea-plugin/quality-checks.json
            quality-test-plan.json
            quality-test-execution-plan.json
            quality-checks.json
          if-no-files-found: ignore

  dependency-review:
    needs: source-plan
    if: needs.source-plan.outputs.dependency-review == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  candidate-quality:
    if: always()
    needs: [source-plan, source-checks, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require successful applicable checks
        env:
          PLAN_RESULT: ${{ needs.source-plan.result }}
          CHECK_RESULT: ${{ needs.source-checks.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
        run: node scripts/source-quality.mjs --phase final
