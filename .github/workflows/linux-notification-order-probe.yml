name: linux-notification-order-probe
run-name: "Notification original complete CI order / ${{ github.ref_name }} / ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-quality-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  candidate-scope:
    runs-on: ubuntu-latest
    outputs:
      cores: ${{ steps.cores.outputs.cores }}
      gea-sha: ${{ steps.group.outputs.gea-sha }}
      workbench-sha: ${{ steps.group.outputs.workbench-sha }}
      manage-sha: ${{ steps.group.outputs.manage-sha }}
      group-id: ${{ steps.group.outputs.group-id }}
      source-kind: ${{ steps.group.outputs.source-kind }}
      baseline-id: ${{ steps.group.outputs.baseline-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require supported same-repository event
        env:
          QUALITY_SCOPE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: node scripts/run-quality-ci.mjs --phase scope
      - name: Resolve immutable Workbench reader source
        id: reader
        env:
          QUALITY_OWN_REPO: dsh-gea-plugin
          QUALITY_SCOPE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          QUALITY_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALITY_GROUP_WORKBENCH: ${{ inputs.workbench_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const own = process.env.QUALITY_OWN_REPO;
          const fullSha = value => typeof value === 'string' && value.length === 40 && /^[a-f0-9]{40}$/.test(value);
          if (!['dsh-agent-manage', 'dsh-gea-plugin'].includes(own) || process.env.GITHUB_REPOSITORY !== `CleverC2200/${own}` || process.env.QUALITY_SCOPE_ALLOWED !== 'true')
            throw Error('CANDIDATE_SCOPE_REQUIRED: registered own event');
          const actual = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!fullSha(process.env.QUALITY_EXPECTED_SHA) || actual !== process.env.QUALITY_EXPECTED_SHA)
            throw Error('CANDIDATE_EVENT_MISMATCH: actual own event');
          let head;
          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') head = process.env.QUALITY_GROUP_WORKBENCH;
          else if (['push', 'pull_request'].includes(process.env.GITHUB_EVENT_NAME)) {
            const file = 'scripts/quality-peer-baseline.json';
            const bytes = readFileSync(file);
            if (!bytes.equals(execFileSync('git', ['show', `HEAD:${file}`])))
              throw Error('CANDIDATE_BASELINE_REQUIRED: committed original bytes');
            const baseline = JSON.parse(bytes);
            const entries = baseline.repositories?.filter(entry => entry.repo === 'dsh-agent-workbench');
            if (baseline.schemaVersion !== 1 || entries?.length !== 1)
              throw Error('CANDIDATE_BASELINE_REQUIRED: unique frozen Workbench source');
            head = entries[0].head;
          } else throw Error('CANDIDATE_SCOPE_REQUIRED: supported source event');
          if (!fullSha(head)) throw Error('CANDIDATE_BASELINE_REQUIRED: immutable Workbench full commit');
          appendFileSync(process.env.GITHUB_OUTPUT, `workbench-sha=${head}\n`);
          NODE
      - name: Require explicit peer contents-read credential
        env:
          PEER_READ_TOKEN: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
        run: |
          node -e "if (!process.env.PEER_READ_TOKEN) throw Error('CANDIDATE_PEER_REQUIRED: configure peer contents-read token')"
      - uses: actions/checkout@v7
        with:
          repository: CleverC2200/dsh-agent-workbench
          ref: ${{ steps.reader.outputs.workbench-sha }}
          path: scope-peer/dsh-agent-workbench
          fetch-depth: 0
          token: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
          persist-credentials: false
      - name: Bind frozen peer source and actual own event through the public reader
        id: group
        env:
          QUALITY_SCOPE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          QUALITY_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALITY_GROUP_GEA: ${{ inputs.gea_sha }}
          QUALITY_GROUP_WORKBENCH: ${{ inputs.workbench_sha }}
          QUALITY_GROUP_MANAGE: ${{ inputs.manage_sha }}
        run: node "$GITHUB_WORKSPACE/scope-peer/dsh-agent-workbench/scripts/read-hosted-peer-input.mjs" --repo dsh-gea-plugin
      - name: Read the registered official baselines
        id: cores
        run: node --input-type=module -e 'import fs from "node:fs"; import {supportedCores} from "./scripts/supported-cores.mjs"; fs.appendFileSync(process.env.GITHUB_OUTPUT, "cores=" + JSON.stringify(supportedCores.filter(core => core.head === "5badb15009ae1756c3afe0ae0cef1faafc290ccc").map(core => core.head)) + "\n")'

  gates:
    needs: candidate-scope
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJSON(needs.candidate-scope.outputs.cores) }}
    timeout-minutes: 240
    env:
      GEA_NOTIFICATION_ORDER_RECEIPT: ${{ github.workspace }}/notification-order.jsonl
      GEA_TEST_LIFECYCLE_RECEIPT: ${{ github.workspace }}/probe-lifecycle.jsonl
      QUALITY_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QUALITY_CANDIDATE: ${{ github.workspace }}/candidate-input.json
    defaults:
      run:
        working-directory: candidate/dsh-gea-plugin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: candidate/dsh-gea-plugin
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require explicit peer contents-read credential
        env:
          PEER_READ_TOKEN: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
        run: |
          node -e "if (!process.env.PEER_READ_TOKEN) throw Error('CANDIDATE_PEER_REQUIRED: configure peer contents-read token')"
      - uses: actions/checkout@v7
        with:
          repository: CleverC2200/dsh-agent-manage
          ref: ${{ needs.candidate-scope.outputs.manage-sha }}
          fetch-depth: 0
          path: candidate/dsh-agent-manage
          token: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: CleverC2200/dsh-agent-workbench
          ref: ${{ needs.candidate-scope.outputs.workbench-sha }}
          fetch-depth: 0
          path: source/dsh-agent-workbench
          token: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.core }}
          fetch-depth: 0
          path: source/official-core
          persist-credentials: false
      - name: Enable declared package managers
        run: |
          npm install --global npm@11.11.0
          corepack enable
      - name: Bind frozen peer source and actual own event
        id: group
        env:
          QUALITY_GROUP_GEA: ${{ needs.candidate-scope.outputs.gea-sha }}
          QUALITY_GROUP_WORKBENCH: ${{ needs.candidate-scope.outputs.workbench-sha }}
          QUALITY_GROUP_MANAGE: ${{ needs.candidate-scope.outputs.manage-sha }}
          QUALITY_GROUP_ID: ${{ needs.candidate-scope.outputs.group-id }}
          QUALITY_SOURCE_KIND: ${{ needs.candidate-scope.outputs.source-kind }}
          QUALITY_BASELINE_ID: ${{ needs.candidate-scope.outputs.baseline-id }}
          CORE_HEAD: ${{ matrix.core }}
        run: node "$GITHUB_WORKSPACE/source/dsh-agent-workbench/scripts/write-hosted-group.mjs" --repo dsh-gea-plugin --root "$GITHUB_WORKSPACE" --core-head "$CORE_HEAD" --workbench-source
      - name: Bind diagnostic original source and notification assertions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const base = "7a4100c39a32488debff78c22ef481919ae8d2aa";
          const original = execFileSync('git', ['show', base + ':tests/notifications.test.mjs']);
          const diagnostic = readFileSync('tests/notifications.test.mjs');
          const stripped = diagnostic.toString().replace(/\/\/ \[CI-NOTIFICATION-ORDER\] begin\n[\s\S]*?\/\/ \[CI-NOTIFICATION-ORDER\] end\n/g, '');
          if (stripped !== original.toString()) throw Error('NOTIFICATION_ORIGINAL_ASSERTIONS_CHANGED');
          if (git('rev-parse', 'HEAD:src') !== git('rev-parse', base + ':src')) throw Error('PROBE_SOURCE_CHANGED');
          writeFileSync(process.env.GITHUB_WORKSPACE + '/probe-metadata.json', JSON.stringify({
            diagnosticHead: git('rev-parse', 'HEAD'), originalHead: base, sourceTree: git('rev-parse', 'HEAD:src'), originalSourceTree: git('rev-parse', base + ':src'),
            originalNotificationSha256: createHash('sha256').update(original).digest('hex'), diagnosticNotificationSha256: createHash('sha256').update(diagnostic).digest('hex'), originalAssertionsUnchanged: true,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT, event: process.env.GITHUB_EVENT_NAME, node: process.versions.node, platform: process.platform, architecture: process.arch,
            fullCommand: "corepack pnpm test:ci-full", scope: 'original complete quality order, failing alpha Core', instrumentation: 'notification observations and existing lifecycle only',
          }, null, 2) + '\n');
          NODE
      - name: Prepare independent SDK and run frozen source quality gates
        env:
          CORE_HEAD: ${{ matrix.core }}
          INPUT_SHA256: ${{ steps.group.outputs.input-sha256 }}
        run: |
          set -o pipefail
          node scripts/run-quality-ci.mjs --prepare-sdk --core-source "$GITHUB_WORKSPACE/source/official-core" --prepare-inputs --core-head "$CORE_HEAD" --input "$QUALITY_CANDIDATE" --final-group-sha256 "$INPUT_SHA256" --final-group-workbench "$GITHUB_WORKSPACE/source/dsh-agent-workbench" 2>&1 | tee "$GITHUB_WORKSPACE/probe-quality.log"

      - name: Keep independent quality results including failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notification-order-${{ github.sha }}-${{ matrix.core }}
          path: |
            candidate-input.json
            candidate-group.json
            profile-source-inputs.json
            source-window-inputs.json
            prepared-workbench.json
            browser-preparation.json
            probe-metadata.json
            probe-quality.log
            probe-lifecycle.jsonl
            notification-order.jsonl
            quality-checks.json
            candidate/dsh-gea-plugin/.runtime/quality-fast.json
          if-no-files-found: warn

  candidate-quality:
    if: always()
    needs: [candidate-scope, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Reject failed, skipped, cancelled or absent gates
        env:
          QUALITY_SCOPE_RESULT: ${{ needs.candidate-scope.result }}
          QUALITY_GATE_RESULT: ${{ needs.gates.result }}
        run: node scripts/run-quality-ci.mjs --phase final
